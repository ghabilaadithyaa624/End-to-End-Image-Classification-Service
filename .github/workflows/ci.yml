name: CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  test:
    name: Test Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v


  docker:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t image-classifier:${{ github.sha }} \
            .


  container-test:
    name: Test Docker Container
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t image-classifier:${{ github.sha }} \
            .

      - name: Start container
        run: |
          docker run -d \
            --name image-classifier \
            -p 8000:8000 \
            image-classifier:${{ github.sha }}

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -f http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs image-classifier
          exit 1

      - name: Test health
        run: |
          curl -f http://127.0.0.1:8000/health

      - name: Test readiness
        run: |
          curl -f http://127.0.0.1:8000/health/ready

      - name: Cleanup
        if: always()
        run: |
          docker logs image-classifier || true
          docker rm -f image-classifier || true


  publish:
    name: Publish Docker Image
    needs:
      - test
      - container-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/image-classification-mlops:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/image-classification-mlops:latest
