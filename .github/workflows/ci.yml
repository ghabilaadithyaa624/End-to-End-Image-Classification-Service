name: Image Classification CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:

  test:

    name: Test Python Application

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v


  docker:

    name: Build Docker Image

    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t image-classifier:${{ github.sha }} \
            .


  container-test:

    name: Test Docker Container

    runs-on: ubuntu-latest

    needs:
      - docker

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t image-classifier:${{ github.sha }} \
            .

      - name: Start container
        run: |
          docker run \
            -d \
            --name image-classifier \
            -p 8000:8000 \
            image-classifier:${{ github.sha }}

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/health; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to start"
          docker logs image-classifier
          exit 1

      - name: Test liveness
        run: |
          curl --fail http://localhost:8000/health

      - name: Test readiness
        run: |
          curl --fail http://localhost:8000/health/ready

      - name: Show container logs
        if: always()
        run: |
          docker logs image-classifier

      - name: Stop container
        if: always()
        run: |
          docker stop image-classifier || true
          docker rm image-classifier || true

