apiVersion: apps/v1
kind: Deployment

metadata:
  name: image-classifier
  labels:
    app: image-classifier

spec:

  replicas: 1

  selector:
    matchLabels:
      app: image-classifier

  template:

    metadata:
      labels:
        app: image-classifier

    spec:

      containers:

        - name: image-classifier

          image: 929514687018.dkr.ecr.ap-south-1.amazonaws.com/image-classification-mlops:2.0

          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: image-classifier-config

          ports:

            - containerPort: 8000
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "1"
              memory: "400Mi"

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000

            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

