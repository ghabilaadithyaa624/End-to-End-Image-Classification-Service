# Training & Experiment Configuration

project:
  name: "image-classification-mlops"
  experiment_name: "mobilenetv3-transfer-learning"

model:
  architecture: "mobilenet_v3_small"
  pretrained: true
  num_classes: 2
  classes: ["cat", "dog"]
  save_path: "models/model.pt"

data:
  train_data_dir: "data/raw/train"
  val_data_dir: "data/raw/val"
  test_data_dir: "data/raw/test"
  image_size: [224, 224]
  batch_size: 32
  num_workers: 4

hyperparameters:
  epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adamw"  # adamw, adam, sgd
  scheduler: "cosine"  # cosine, step, none
  step_size: 5
  gamma: 0.1

mlflow:
  tracking_uri: "./mlruns"
  log_models: true
