# Training & Experiment Configuration

project:
  name: "image-classification-mlops"
  experiment_name: "resnet18-cat-dog-classification"

model:
  name: "resnet18"
  architecture: "resnet18"
  pretrained: true
  num_classes: 2
  classes: ["cat", "dog"]
  save_path: "models/image_classifier.pth"

data:
  data_dir: "data/raw"
  train_data_dir: "data/raw/train"
  val_data_dir: "data/raw/val"
  test_data_dir: "data/raw/test"
  image_size: [224, 224]
  batch_size: 32
  num_workers: 2

training:
  epochs: 1
  learning_rate: 0.0005
  weight_decay: 0.0001
  optimizer: "adam"

hyperparameters:
  epochs: 10
  learning_rate: 0.0005
  weight_decay: 0.0001
  optimizer: "adam"
  scheduler: "cosine"

output:
  model_path: "models/image_classifier.pth"
  checkpoint_path: "models/best_checkpoint.pth"

mlflow:
  tracking_uri: "http://127.0.0.1:5000"
  log_models: true
